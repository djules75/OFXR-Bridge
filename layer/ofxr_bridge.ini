[ofxr]
enabled=1
frame_generation=ofxr
motion_vectors=off
backend=nvidia
nvidia_route=new
nvidia_preset=medium
nvidia_input_scale=50
nvidia_bidirectional=0
dlssg_resolution=100
deep_pipeline=1
triple_frame_gen=0
separate_synthesis=0
single_swapchain_rings=0
steamvr_separate_queue=1
d3d11_bridge=1
vulkan_bridge=1
vulkan_session_bridge=1

[diagnostics]
logging_enabled=0
max_file_mb=32
flush_each_event=0

[overlay]
position=upper_right

[experimental]
luke_afw_mode=3
luke_afw_debug=0
luke_afw_clear_before_warping=0
luke_afw_ignore_motion_threshold=2.5
luke_afw_depth_dilate_mode=1
