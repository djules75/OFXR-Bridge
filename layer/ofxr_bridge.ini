[ofxr]
backend=fidelityfx
nvidia_preset=medium
nvidia_input_scale=50
nvidia_bidirectional=0
; FidelityFX optical-flow input scale: 100, 75 or 50 percent per axis.
; 100 keeps the previous behaviour. Lower trades motion-vector detail for a
; cheaper pack and flow, which matters at high headset resolutions.
fidelityfx_input_scale=100

[diagnostics]
logging_enabled=0
max_file_mb=32
flush_each_event=0

[overlay]
position=upper_right
