[ofxr]
enabled=1
frame_generation=ofxr
motion_vectors=off
backend=nvidia
nvidia_preset=medium
; Optical-flow input scale for either backend: 100, 75 or 50 percent per
; axis. Lower trades motion-vector detail for a cheaper pack and flow, which
; matters at high headset resolutions.
nvidia_input_scale=50
nvidia_bidirectional=0
; "Prefer FPS over latency" in the tray: one frame of extra depth for games that
; only just reach half the headset's refresh rate, at about one frame of
; latency. 1 on (default), 0 off. Read when the game starts its session.
deep_pipeline=1
; "3X Frame Gen" in the tray: two generated frames for every game frame, for
; games at a third of the headset's refresh rate. 0 off (default), 1 on.
; Followed live in a running game that started with deep_pipeline=1.
triple_frame_gen=0
; Programs the layer stays out of, by executable name, separated by ';'.
; Pimax Home takes the headset whenever a game leaves VR and would otherwise
; hold the layer's buffers at full resolution the whole time. Leave empty
; to exclude nothing.
excluded_processes=PimaxHome-Win64-Shipping.exe
; Frame generation for Vulkan games. 1 on (default), 0 off; not in the tray's
; menu, set vulkan_bridge=0 in tray.ini instead. Needs the OFXR Vulkan layer
; registered beside this one, which the tray does while armed with it on.
vulkan_bridge=1
d3d11_bridge=1

[diagnostics]
logging_enabled=0
; Raise for a long capture: at the usual record density 32 MB wraps at about
; ninety seconds and keeps only the tail. Edits here survive arming.
max_file_mb=32
flush_each_event=0

[overlay]
position=upper_right
